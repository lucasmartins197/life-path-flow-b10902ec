workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: com.apostandonavida.stakereal
        VITE_SUPABASE_URL: https://dmrlkxwpbwmzpdecsgnw.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: $SUPABASE_ANON_KEY
      node: "22"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Init Capacitor
        script: npx cap init "Saindo do Jogo" "com.apostandonavida.stakereal" --web-dir dist
      - name: Add Android platform
        script: npx cap add android || true
      - name: Gerar icones do app (ancora)
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android --assetPath assets
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build Android AAB
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab

  ios-release:
    name: iOS Release
    max_build_duration: 120
    integrations:
      app_store_connect: STAKE REAL
    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.apostandonavida.stakereal
      vars:
        BUNDLE_ID: com.apostandonavida.stakereal
        VITE_SUPABASE_URL: https://dmrlkxwpbwmzpdecsgnw.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: $SUPABASE_ANON_KEY
      node: "22"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Init Capacitor
        script: npx cap init "Saindo do Jogo" "com.apostandonavida.stakereal" --web-dir dist
      - name: Add iOS platform
        script: |
          npx cap add ios
          echo "=== Conteudo da pasta ios apos cap add ==="
          ls -la ios/ || echo "PASTA ios NAO CRIADA"
          ls -la ios/App/ || echo "ios/App NAO existe"
          echo "=== Procurar Podfile ==="
          find ios -name Podfile 2>/dev/null || echo "Podfile NAO encontrado"
      - name: Registrar deep link (saindodojogo://) no Info.plist
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string saindodojogo" "$PLIST" 2>/dev/null || true
          echo "Deep link saindodojogo:// registrado no Info.plist"
      - name: Gerar icones do app (ancora)
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --ios --assetPath assets
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Fix deployment target
        script: |
          # Capacitor 8 usa Swift Package Manager (SPM), nao CocoaPods.
          # Nao existe Podfile; ajustamos o deployment target no projeto Xcode.
          find ios -name project.pbxproj -exec sed -i "" "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g" {} \;
          echo "Deployment target ajustado para 16.0"
      - name: Build and export IPA
        script: |
          xcode-project use-profiles
          # Capacitor 8/SPM usa .xcodeproj (nao ha .xcworkspace)
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App --config Release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
